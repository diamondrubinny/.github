name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security vulnerabilities must not be reported here** — use the Security tab → "Report a vulnerability".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.4.1
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Windows 11, Chrome 130, Android TV 12, Docker 27
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove any tokens, passwords or personal data before pasting.
      render: shell
